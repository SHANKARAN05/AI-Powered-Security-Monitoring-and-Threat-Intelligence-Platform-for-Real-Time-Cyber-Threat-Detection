<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}AI Security Monitoring{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand">AI Security Monitoring &amp; Threat Intelligence</div>
  <nav class="nav">
    <a href="{{ url_for('views.dashboard_page') }}">Dashboard</a>
    <a href="{{ url_for('views.alerts_page') }}">Alerts</a>
    <a href="{{ url_for('views.models_page') }}">Models</a>
  </nav>
</header>
<main class="content">
  {% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
